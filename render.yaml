services:
  - type: web
    name: bhumisetu-indore-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bhumisetu-indore-db
          property: connectionString
      - key: DATA_DIR
        value: /app/runtime
      - key: ALLOWED_ORIGINS
        value: https://bhumisetu-indore.onrender.com
    disk:
      name: bhumisetu-indore-runtime
      mountPath: /app/runtime
      sizeGB: 1

  - type: web
    name: bhumisetu-indore
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://bhumisetu-indore-api.onrender.com/api

databases:
  - name: bhumisetu-indore-db
    databaseName: harmonization
    user: landreview
