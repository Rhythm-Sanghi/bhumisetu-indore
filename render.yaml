services:
  - type: web
    name: bhumisetu-indore-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /app/runtime
      - key: DEMO_BUILDING_LIMIT
        value: "1200"
      - key: ALLOWED_ORIGINS
        # The static site redirects to this service so the browser sends
        # same-origin POST requests to /api. Keep the static origin too for
        # direct visits while a deployment is propagating.
        value: https://bhumisetu-indore-api.onrender.com,https://bhumisetu-indore.onrender.com

  - type: web
    name: bhumisetu-indore
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_APP_REDIRECT
        value: https://bhumisetu-indore-api.onrender.com
