services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: harmonization
      POSTGRES_USER: landreview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-pilot-only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landreview -d harmonization"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://landreview:${POSTGRES_PASSWORD:-local-pilot-only}@db:5432/harmonization
      DATA_DIR: /app/runtime
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - project_files:/app/runtime
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
  web:
    build:
      context: frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgis_data:
  project_files:
